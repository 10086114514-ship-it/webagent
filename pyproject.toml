[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webagent"
version = "1.0.4"
description = "Screen-recognition web automation agent driven by any OpenAI-compatible model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "webagent contributors" }]
keywords = ["automation", "gui-agent", "llm", "ocr", "vision", "windows", "rpa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/10086114514-ship-it/webagent"
Issues = "https://github.com/10086114514-ship-it/webagent/issues"

[project.scripts]
webagent = "webagent.__main__:main"

[tool.setuptools]
packages = ["webagent"]

[tool.setuptools.package-data]
webagent = ["*.ps1"]
